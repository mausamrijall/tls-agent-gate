<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Site A — Agentic Caller</title>
  <style>
    :root { color-scheme: light; }
    body { font-family: system-ui, sans-serif; margin: 0; background: #f6f8fa; color: #0f172a; }
    header { background: #0b6e4f; color: #fff; padding: 18px 28px; }
    header h1 { margin: 0; font-size: 20px; }
    header p { margin: 4px 0 0; opacity: .85; font-size: 13px; }
    main { max-width: 860px; margin: 24px auto; padding: 0 20px; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 18px; margin-bottom: 18px; }
    label { font-weight: 600; font-size: 13px; }
    input[type=text] { width: 100%; box-sizing: border-box; padding: 10px 12px; margin: 8px 0 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; }
    button { background: #0b6e4f; color: #fff; border: 0; border-radius: 8px; padding: 10px 16px; font-size: 14px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    pre { background: #0f172a; color: #e2e8f0; padding: 14px; border-radius: 8px; overflow: auto; font-size: 12px; max-height: 360px; }
    .muted { color: #64748b; font-size: 12px; }
    .row { display: flex; gap: 10px; align-items: center; }
    .badge { display: inline-block; background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; border-radius: 999px; padding: 2px 10px; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>Site A — Agentic Caller</h1>
    <p>An Open Agentic Web site. It signs outbound agent requests with an Ed25519 key anchored to its HTTPS/identity origin.</p>
  </header>
  <main>
    <section class="card">
      <h2>Call a peer agent</h2>
      <label for="target-url">Protected endpoint (Site B)</label>
      <input type="text" id="target-url" value="http://localhost:4174/api/agent/search?q=agents" />
      <div class="row">
        <button id="call">Run signed agent call</button>
        <span class="muted">A consent prompt appears before the cross-origin call.</span>
      </div>
      <p class="badge" id="status">not started</p>
    </section>

    <section class="card">
      <h2>Result (sanitized in a WebWorker)</h2>
      <pre id="result">—</pre>
    </section>

    <section class="card">
      <h2>Trust Inspector</h2>
      <div id="inspector"></div>
    </section>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
